<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cafeteria Orfeu</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen text-white">
<div
        class="fixed inset-0 -z-20 bg-[url('https://i.pinimg.com/originals/00/f8/c1/00f8c1e0b715703c0a60e574a18d5083.gif')] bg-cover bg-center"
></div>
<div class="fixed inset-0 -z-10 bg-black/55 backdrop-blur-[2px]"></div>

<main class="mx-auto max-w-6xl px-4 py-8 sm:px-6 lg:px-8">
  <header class="mb-10 text-center">
    <p class="text-sm uppercase tracking-[0.35em] text-amber-300">
      Café livros
    </p>
    <h1 class="mt-3 text-4xl font-black tracking-tight sm:text-5xl">
      Monte seu café!
    </h1>
    <p class="mx-auto mt-4 max-w-2xl text-sm text-stone-200 sm:text-base">
      Escolha a bebida, selecione os grãos que desejar.
    </p>
  </header>

  <section class="grid gap-8 lg:grid-cols-[1fr_420px]">
    <div class="rounded-3xl border border-white/10 bg-stone-950/60 p-6 shadow-2xl">
      <h2 class="text-2xl font-bold text-amber-100">Novo pedido</h2>
      <div
              id="mensagem-erro"
              class="mt-5 hidden rounded-2xl border border-red-400/40 bg-red-500/10 px-4 py-3 text-sm text-red-200"
      ></div>
      <form id="form-pedido" class="mt-6 grid gap-5">
        <div>
          <label for="cafe" class="mb-2 block text-sm font-semibold text-stone-200">
            Café
          </label>
          <select
                  id="cafe"
                  class="w-full rounded-2xl border border-white/10 bg-stone-900/90 px-4 py-3 text-white outline-none focus:border-amber-300"
          >
            <option value="">Selecione um café</option>
          </select>
        </div>

        <div>
          <label for="grao" class="mb-2 block text-sm font-semibold text-stone-200">
            Grãos
          </label>
          <select
                  id="grao"
                  class="w-full rounded-2xl border border-white/10 bg-stone-900/90 px-4 py-3 text-white outline-none focus:border-amber-300"
          >
            <option value="">Selecione um grão</option>
          </select>
        </div>

        <div>
          <label for="quantidade" class="mb-2 block text-sm font-semibold text-stone-200">
            Quantidade
          </label>
          <input
                  id="quantidade"
                  type="number"
                  min="1"
                  value="1"
                  class="w-full rounded-2xl border border-white/10 bg-stone-900/90 px-4 py-3 text-white outline-none focus:border-amber-300"
          />
        </div>

        <button
                type="submit"
                class="rounded-2xl bg-amber-300 px-5 py-3 font-black uppercase text-stone-950 transition hover:bg-amber-200"
        >
          Adicionar café
        </button>
      </form>
    </div>

    <aside class="rounded-3xl border border-white/10 bg-stone-950/60 p-6 shadow-2xl">
      <div class="flex items-center justify-between gap-4">
        <div>
          <p class="text-xs uppercase tracking-[0.35em] text-amber-300">Resumo</p>
          <h2 class="mt-2 text-2xl font-bold text-amber-100">Pedido</h2>
        </div>

        <button
                id="btn-limpar"
                type="button"
                class="rounded-xl border border-white/10 px-4 py-2 text-xs font-bold uppercase text-stone-300 transition hover:border-red-400 hover:text-red-300"
        >
          Limpar
        </button>
      </div>

      <div id="lista-pedidos" class="mt-6 space-y-4"></div>

      <div class="mt-8 border-t border-white/10 pt-6">
        <div class="flex items-center justify-between">
          <span class="text-sm font-bold uppercase text-stone-300">Total</span>
          <span id="valor-total" class="text-3xl font-black text-amber-300">R$ 0,00</span>
        </div>
      </div>
    </aside>
  </section>
</main>

<script src="./app.js"></script>
</body>
</html>
